<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05070d" />
    <title>ICOS · Offline</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
        box-sizing: border-box;
        color: #e7edf9;
        background: radial-gradient(700px 400px at 50% 0%, rgb(124 58 237 / 18%), transparent 60%), #04060c;
        font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main {
        max-width: 420px;
        text-align: center;
      }
      .mark {
        width: 64px;
        height: 64px;
        margin: 0 auto 18px;
        border: 2px solid #a78bfa;
        border-radius: 50%;
        display: grid;
        place-items: center;
        box-shadow: 0 0 24px rgb(124 58 237 / 50%);
      }
      .mark::after {
        content: "";
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: #7c89a6;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
      }
      .state {
        display: inline-block;
        margin-bottom: 14px;
        padding: 3px 10px;
        border: 1px dashed #7c89a6;
        border-radius: 6px;
        color: #7c89a6;
        font: 600 12px ui-monospace, Menlo, monospace;
        letter-spacing: 0.06em;
      }
      p {
        margin: 0 0 18px;
        color: #94a0ba;
      }
      button {
        min-height: 44px;
        padding: 0 20px;
        border: 1px solid #38bdf8;
        border-radius: 10px;
        color: #e7edf9;
        background: rgb(56 189 248 / 16%);
        font: 600 14px inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true"></div>
      <h1>ICOS is unreachable</h1>
      <span class="state" role="status">OFFLINE · STATE UNKNOWN</span>
      <p>
        This device cannot reach ICOS. The cockpit never shows cached state as current, so nothing is displayed until the connection returns. No
        command can be sent while offline.
      </p>
      <button type="button" onclick="location.reload()">Retry now</button>
    </main>
    <script>
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
